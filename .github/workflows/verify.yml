name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make setup
      - run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: output/
